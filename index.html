<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=600, height=600, initial-scale=1"
  >

  <title>Shared Counter</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 600px;
      height: 600px;
      margin: 0;
      padding: 0;
      overflow: hidden;

      background: #000;
      color: #fff;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main {
      width: 100%;
      height: 100%;

      padding: 55px;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: space-between;

      text-align: center;
    }

    h1 {
      margin: 0;

      font-size: 46px;
      font-weight: 600;

      letter-spacing: 2px;
    }

    /* CONNECTION STATUS */

    #status {
      font-size: 20px;
      opacity: 0.7;
    }

    #status.connected {
      opacity: 1;
    }

    /* COUNTER */

    #number {
      font-size: 150px;
      line-height: 1;

      font-weight: bold;
    }

    /* BUTTON */

    button {
      width: 100%;

      padding: 24px;

      border: 4px solid #777;
      border-radius: 20px;

      background: #111;
      color: #fff;

      font-size: 34px;
      font-weight: 600;

      cursor: pointer;
    }

    /*
      This is important for the glasses.

      The focused element is essentially
      what you're selecting with the
      Neural Band.
    */

    button:focus {
      outline: 8px solid #fff;
      outline-offset: 5px;

      border-color: #fff;

      background: #222;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>


<body>

  <main>

    <h1>SHARED COUNTER</h1>

    <div id="status">
      Connecting...
    </div>

    <div id="number">
      --
    </div>

    <button
      id="addButton"
      class="focusable"
      autofocus
    >
      Add One
    </button>

  </main>


  <!--
    Supabase JavaScript library.

    This gives the page access to
    the database + realtime system.
  -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    /*
    ==================================================
                      CONFIGURATION
    ==================================================

    REPLACE THESE TWO VALUES.

    You can find them in:

    Supabase
        ↓
    Project Settings
        ↓
    API

    The publishable/anon key is SAFE
    to expose here as long as RLS is
    configured.

    DO NOT put a service_role key here.
    ==================================================
    */


    const SUPABASE_URL =
      "PASTE_YOUR_SUPABASE_URL_HERE";


    const SUPABASE_KEY =
      "PASTE_YOUR_PUBLISHABLE_KEY_HERE";



    /*
    ==================================================
                      SETUP
    ==================================================
    */


    const client = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    const display =
      document.getElementById("number");


    const button =
      document.getElementById("addButton");


    const statusDisplay =
      document.getElementById("status");


    let currentValue = 0;

    let updating = false;



    /*
    ==================================================
                    LOAD COUNTER
    ==================================================
    */


    async function loadCounter() {

      const { data, error } =
        await client
          .from("shared_counter")
          .select("value")
          .eq("id", 1)
          .single();


      if (error) {

        console.error(
          "Could not load counter:",
          error
        );

        display.textContent = "ERR";

        statusDisplay.textContent =
          "Connection Error";

        return;
      }


      currentValue = data.value;

      display.textContent =
        currentValue;
    }



    /*
    ==================================================
                      ADD ONE
    ==================================================
    */


    async function addOne() {

      if (updating) {
        return;
      }


      updating = true;

      button.textContent =
        "Updating...";


      /*
        Get the newest value before
        changing it.
      */

      const {
        data: latest,
        error: readError
      } =
        await client
          .from("shared_counter")
          .select("value")
          .eq("id", 1)
          .single();



      if (readError) {

        console.error(
          "Read error:",
          readError
        );

        button.textContent =
          "Add One";

        updating = false;

        button.focus();

        return;
      }



      const newValue =
        latest.value + 1;



      /*
        Update Supabase.

        Once this succeeds, Supabase
        broadcasts the new value to
        everyone currently connected.
      */


      const {
        error: updateError
      } =
        await client
          .from("shared_counter")
          .update({
            value: newValue
          })
          .eq("id", 1);



      if (updateError) {

        console.error(
          "Update error:",
          updateError
        );

      }



      button.textContent =
        "Add One";


      updating = false;


      /*
        Put focus back onto the button
        so the glasses can immediately
        select it again.
      */


      button.focus();
    }



    /*
    ==================================================
                  BUTTON LISTENER
    ==================================================
    */


    button.addEventListener(
      "click",
      addOne
    );



    /*
    ==================================================
                  REALTIME UPDATES
    ==================================================

    This is the cool part.

    Whenever ANY device changes the
    database:

        Supabase
            ↓
        WebSocket
            ↓
        Every open copy of this app

    ==================================================
    */


    const channel =
      client
        .channel(
          "shared-counter"
        )

        .on(

          "postgres_changes",

          {

            event: "UPDATE",

            schema: "public",

            table: "shared_counter",

            filter: "id=eq.1"

          },

          payload => {

            console.log(
              "Realtime update:",
              payload
            );


            currentValue =
              payload.new.value;


            display.textContent =
              currentValue;

          }

        )

        .subscribe(

          status => {

            console.log(
              "Realtime status:",
              status
            );


            if (
              status ===
              "SUBSCRIBED"
            ) {

              statusDisplay.textContent =
                "● LIVE";

              statusDisplay.classList.add(
                "connected"
              );

            }

            else if (
              status ===
              "CHANNEL_ERROR"
            ) {

              statusDisplay.textContent =
                "Connection Error";

            }

            else if (
              status ===
              "TIMED_OUT"
            ) {

              statusDisplay.textContent =
                "Timed Out";

            }

          }

        );



    /*
    ==================================================
                      START
    ==================================================
    */


    loadCounter();


    /*
      Keep the button selected when
      the app initially opens.
    */


    button.focus();



    /*
    ==================================================
              DESKTOP TESTING CONTROLS
    ==================================================

    Enter / Space = select

    This lets you test approximately
    how the glasses interaction feels
    from your computer.
    ==================================================
    */


    document.addEventListener(

      "keydown",

      event => {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          addOne();

        }

      }

    );

  </script>

</body>
</html>
