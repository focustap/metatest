<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=600, height=600, initial-scale=1"
>

<title>Ben's Test App</title>

<style>
* {
box-sizing: border-box;
}

html,
body {
width: 600px;
height: 600px;
margin: 0;
overflow: hidden;
background: black;
color: white;
font-family: Arial, sans-serif;
}

main {
height: 100%;
padding: 60px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
text-align: center;
}

h1 {
margin: 0;
font-size: 52px;
}

#number {
font-size: 150px;
font-weight: bold;
}

button {
width: 100%;
padding: 24px;
border: 4px solid white;
border-radius: 18px;
background: black;
color: white;
font-size: 34px;
}

button:focus {
outline: 10px solid white;
background: #222;
}
</style>
</head>

<body>
<main>
<h1>Ben's First App</h1>

<div id="number">0</div>

<button class="focusable" id="addButton">
Add One
</button>
</main>

<script>
let number = 0;

const display = document.getElementById("number");
const button = document.getElementById("addButton");

button.addEventListener("click", () => {
number++;
display.textContent = number;
});

button.focus();
</script>
</body>
</html>
